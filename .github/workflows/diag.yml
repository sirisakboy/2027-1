name: diag
on: [push, workflow_dispatch]
jobs:
  diag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: which-modules
        run: |
          for m in PIL fontTools tkinter; do
            if python3 -c "import $m" >/dev/null 2>&1; then echo "::notice::$m=YES"; else echo "::notice::$m=NO"; fi
          done
      - name: probe
        run: |
          python3 tools/proxy-gui/tests/probe_ci.py || true
          cat /tmp/probe.txt 2>/dev/null | while IFS= read -r l; do echo "::error::P $l"; done
          exit 0
