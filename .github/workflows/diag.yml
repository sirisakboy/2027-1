name: diag
on: [push, workflow_dispatch]
jobs:
  diag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: which-modules
        run: |
          set +e
          for m in PIL fontTools tkinter; do
            python3 -c "import $m; print('$m YES')" >/dev/null 2>&1 && echo "::notice::$m=YES" || echo "::notice::$m=NO"
          done
      - name: reproduce-20b
        run: |
          set +e
          python3 - > /tmp/o.txt 2>&1 <<'PY'
import importlib.util, contextlib, io, sys, traceback
sys.path.insert(0, "tools/proxy-gui/tests/stubs")
sys.path.insert(0, "tools/proxy-gui")
spec = importlib.util.spec_from_file_location("rp", "tools/proxy-gui/tests/render_preview.py")
rp = importlib.util.module_from_spec(spec)
try:
    with contextlib.redirect_stderr(io.StringIO()):
        spec.loader.exec_module(rp)
    print("import rp OK, TH =", rp.TH, "FONT_R =", rp.FONT_R)
except Exception:
    print("IMPORT FAILED:"); traceback.print_exc(); sys.exit(3)
try:
    from PIL import Image, ImageDraw
    print("PIL import OK")
except Exception as e:
    print("PIL missing:", e); sys.exit(4)
try:
    img = Image.new("RGB",(10,10)); d = ImageDraw.Draw(img)
    w = rp.measure(d, "ทดสอบ ▸", rp.font(13))
    print("measure OK =", w)
    rp.draw_mixed(d, (0,0), "▸ Apply ✔ ไทย", rp.font(13), fill=(255,255,255))
    print("draw_mixed OK")
except Exception:
    print("RENDER FAILED:"); traceback.print_exc(); sys.exit(5)
PY
          cat /tmp/o.txt | while IFS= read -r l; do echo "::error::O $l"; done
          exit 0
